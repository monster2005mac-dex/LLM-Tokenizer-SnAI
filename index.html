<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Playground</title>
<style>
:root{--bg:#0e0f11;--p:#16181b;--p2:#1d2024;--bd:#2a2e33;--tx:#e8eaed;--mut:#8b919a;--ac:#f55036;--ac2:#ff7a63;color-scheme:dark}
:root[data-theme=light]{--bg:#f6f6f4;--p:#fff;--p2:#f0f0ee;--bd:#dcdcd8;--tx:#1a1c1e;--mut:#6b7078;--ac:#e0391f;--ac2:#f55036;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--p)}
.logo{font-weight:700;display:flex;align-items:center;gap:8px;margin-right:8px}.logo i{width:20px;height:20px;border-radius:6px;background:var(--ac)}
.sp{flex:1}
.btn{background:var(--p2);border:1px solid var(--bd);padding:5px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn.on{border-color:var(--ac);color:var(--ac2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.mob{display:none}
main{flex:1;display:flex;min-height:0;position:relative}
aside{width:260px;background:var(--p);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;flex:none}
#left{border-right:1px solid var(--bd)}#right{border-left:1px solid var(--bd);width:310px}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.f{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%;outline:0}
.f:focus{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row span{font-size:12px}
input[type=range]{width:100%;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);text-transform:none;letter-spacing:0}
.ci{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;border:1px solid transparent}
.ci:hover{background:var(--p2)}.ci.on{background:var(--p2);border-color:var(--bd)}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci b{color:var(--mut);font-weight:400}
.ci b:hover{color:var(--ac)}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.m{max-width:840px;width:100%;margin:0 auto;display:flex;gap:12px}
.av{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--p2);border:1px solid var(--bd)}
.assistant .av{background:var(--ac);border-color:var(--ac);color:#fff}
.mc{flex:1;min-width:0}
.body{word-wrap:break-word}.body p{margin:0 0 8px}.body h2,.body h3,.body h4,.body h5{margin:12px 0 6px}
.body ul,.body ol{margin:4px 0 8px;padding-left:22px}.body blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--bd);color:var(--mut)}
.body a{color:var(--ac2)}.body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.body p code,.body li code{background:var(--p2);padding:1px 5px;border-radius:4px}
.cb{border:1px solid var(--bd);border-radius:8px;margin:8px 0;overflow:hidden;background:var(--p2)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mut)}
.cb pre{margin:0;padding:10px 12px;overflow-x:auto}
.meta{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:10px;align-items:center}
.meta button{background:none;border:0;color:var(--mut);cursor:pointer;padding:0;font-size:11px}.meta button:hover{color:var(--ac2)}
.empty{margin:auto;text-align:center;color:var(--mut)}.empty h2{color:var(--tx);margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:6px 12px;cursor:pointer;background:var(--p)}.chip:hover{border-color:var(--ac)}
.composer{padding:10px 16px 14px}
.cbox{max-width:840px;margin:0 auto;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:flex-end}
.cbox:focus-within{border-color:var(--ac)}
.cbox textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:200px}
#cmp{display:none;flex:1;flex-direction:column;min-height:0}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;min-height:0}
.col{border:1px solid var(--bd);border-radius:12px;background:var(--p);display:flex;flex-direction:column;min-height:0}
.col>div:first-child{padding:8px;border-bottom:1px solid var(--bd)}
.col .body{flex:1;overflow:auto;padding:12px}
.col .meta{padding:6px 12px;border-top:1px solid var(--bd);margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px}.st b{display:block;font-size:16px}.st small{color:var(--mut)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:9}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(720px,92vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
.tabs{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--bd)}
#code{margin:0;padding:14px;max-height:60vh;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.dh{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--bd)}
@media(max-width:1000px){.mob{display:inline-block}aside{position:absolute;top:0;bottom:0;z-index:5;display:none;box-shadow:0 0 30px #0008}#left{left:0}#right{right:0}aside.open{display:flex}.cols{grid-template-columns:1fr;overflow:auto}}
</style>
</head>
<body>
<header>
  <button class="btn mob" id="tl">☰</button>
  <div class="logo"><i></i>LLM Playground</div>
  <button class="btn on" id="mChat">Chat</button><button class="btn" id="mCmp">Compare</button>
  <div class="sp"></div>
  <button class="btn" id="codeBtn">&lt;/&gt; Code</button>
  <button class="btn" id="exp">Export</button><button class="btn" id="imp">Import</button>
  <button class="btn" id="theme">Theme</button>
  <button class="btn mob" id="tr">⚙</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <aside id="left">
    <button class="btn pri" id="newc">+ New chat</button>
    <div id="list"></div>
  </aside>
  <section class="center">
    <div id="chatv" class="center">
      <div id="msgs"></div>
    </div>
    <div id="cmp">
      <div class="cols">
        <div class="col"><div class="row"><select class="f" id="mA"></select></div><div class="body" id="bA"></div><div class="meta" id="tA"></div></div>
        <div class="col"><div class="row"><select class="f" id="mB"></select></div><div class="body" id="bB"></div><div class="meta" id="tB"></div></div>
      </div>
    </div>
    <div class="composer"><div class="cbox">
      <textarea id="in" rows="1" placeholder="Message… (Enter to send, Shift+Enter for new line, Esc to stop)"></textarea>
      <button class="btn pri" id="send">Send</button>
    </div></div>
  </section>
  <aside id="right">
    <div><label>Provider</label><select class="f" id="prov"></select></div>
    <div><label>API key</label><input class="f" id="key" type="password" autocomplete="off" placeholder="paste key"></div>
    <div><label>Base URL</label><input class="f" id="base"></div>
    <div><label>Model</label><select class="f" id="model"></select><button class="btn sm" id="load" style="margin-top:6px;width:100%">Load models from API</button></div>
    <div><label>System prompt</label><textarea class="f" id="sys" rows="4"></textarea></div>
    <div><label>Preset</label><select class="f" id="preset"><option value="">Custom</option><option value="0.2,1">Precise (0.2)</option><option value="0.7,1">Balanced (0.7)</option><option value="1.2,0.95">Creative (1.2)</option></select></div>
    <div><div class="row"><label>Temperature</label><span id="tv"></span></div><input type="range" id="temp" min="0" max="2" step="0.05"></div>
    <div><div class="row"><label>Max tokens</label><span id="mv"></span></div><input type="range" id="max" min="64" max="8192" step="64"></div>
    <div><div class="row"><label>Top P</label><span id="pv"></span></div><input type="range" id="top" min="0" max="1" step="0.05"></div>
    <label class="chk"><input type="checkbox" id="stream">Stream responses</label>
    <label class="chk"><input type="checkbox" id="json">JSON mode</label>
    <div><label>Last response</label><div class="stats">
      <div class="st"><b id="s1">–</b><small>tokens/sec</small></div><div class="st"><b id="s2">–</b><small>first token ms</small></div>
      <div class="st"><b id="s3">–</b><small>output tokens</small></div><div class="st"><b id="s4">–</b><small>total s</small></div></div></div>
  </aside>
</main>
<div id="toast"></div>
<dialog id="dlg"><div class="tabs"><button class="btn on" data-l="curl">cURL</button><button class="btn" data-l="python">Python</button><button class="btn" data-l="js">JavaScript</button></div>
<pre id="code"></pre><div class="dh"><button class="btn" id="copy">Copy</button><button class="btn" id="close">Close</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const P={
 groq:{n:'Groq',u:'https://api.groq.com/openai/v1',m:['llama-3.3-70b-versatile','llama-3.1-8b-instant','openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3-32b','meta-llama/llama-4-scout-17b-16e-instruct']},
 openai:{n:'OpenAI',u:'https://api.openai.com/v1',m:['gpt-4o-mini','gpt-4o','gpt-4.1','gpt-4.1-mini']},
 openrouter:{n:'OpenRouter',u:'https://openrouter.ai/api/v1',m:['meta-llama/llama-3.3-70b-instruct','google/gemini-2.0-flash-001','deepseek/deepseek-chat']},
 together:{n:'Together AI',u:'https://api.together.xyz/v1',m:['meta-llama/Llama-3.3-70B-Instruct-Turbo','Qwen/Qwen2.5-72B-Instruct-Turbo']},
 ollama:{n:'Ollama (local)',u:'http://localhost:11434/v1',m:['llama3.2','qwen2.5','mistral']},
 custom:{n:'Custom (OpenAI-compatible)',u:'',m:['model-name']}
};
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({prov:'groq',base:P.groq.u,model:P.groq.m[0],keys:{},loaded:{},sys:'You are a helpful assistant.',temp:.7,max:1024,top:1,stream:true,json:false,theme:'dark'},ld('pg2s',{}));
let C=ld('pg2c',[]),cur=null,busy=false,ctrls=[],mode='chat',lang='curl';
const save=()=>{sv('pg2s',S);sv('pg2c',C)};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
document.documentElement.dataset.theme=S.theme;

/* markdown */
function inl(s){return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(t){
  const codes=[];t=esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{codes.push([l||'code',c]);return '\u0001'+(codes.length-1)+'\u0001'});
  const o=[];let list='',para=[];
  const fp=()=>{if(para.length){o.push('<p>'+inl(para.join('<br>'))+'</p>');para=[]}};
  const fl=()=>{if(list){o.push('</'+list+'>');list=''}};
  for(const ln of t.split('\n')){
    let m;
    if(m=ln.match(/^\u0001(\d+)\u0001$/)){fp();fl();o.push(m[0]);continue}
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){fp();fl();const n=m[1].length+1;o.push('<h'+n+'>'+inl(m[2])+'</h'+n+'>');continue}
    if(m=ln.match(/^\s*([-*]|\d+\.)\s+(.*)/)){fp();const t2=/\d/.test(m[1])?'ol':'ul';if(list!==t2){fl();o.push('<'+t2+'>');list=t2}o.push('<li>'+inl(m[2])+'</li>');continue}
    if(m=ln.match(/^&gt;\s?(.*)/)){fp();fl();o.push('<blockquote>'+inl(m[1])+'</blockquote>');continue}
    if(/^\s*$/.test(ln)){fp();fl();continue}
    fl();para.push(ln);
  }
  fp();fl();
  return o.join('').replace(/\u0001(\d+)\u0001/g,(m,i)=>'<div class="cb"><div class="ch"><span>'+codes[i][0]+'</span><button class="btn sm" data-copy>Copy</button></div><pre><code>'+codes[i][1]+'</code></pre></div>');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){try{navigator.clipboard.writeText(b.closest('.cb').querySelector('pre').textContent)}catch(x){}b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}});

/* chats */
const chat=()=>C.find(c=>c.id===cur);
function newChat(){const c={id:Date.now()+'',title:'New chat',msgs:[]};C.unshift(c);cur=c.id;save();renderList();renderChat()}
function renderList(){
  $('#list').innerHTML=C.map(c=>'<div class="ci'+(c.id===cur?' on':'')+'" data-id="'+c.id+'"><span>'+esc(c.title)+'</span><b data-del="'+c.id+'">✕</b></div>').join('');
}
$('#list').onclick=e=>{
  const d=e.target.closest('[data-del]');
  if(d){C=C.filter(c=>c.id!==d.dataset.del);if(cur===d.dataset.del)cur=C[0]?C[0].id:null;if(!cur)return newChat();save();renderList();renderChat();return}
  const i=e.target.closest('.ci');if(i){cur=i.dataset.id;renderList();renderChat();$('#left').classList.remove('open')}
};
function renderChat(){
  const ch=chat(),box=$('#msgs');
  if(!ch||!ch.msgs.length){box.innerHTML='<div class="empty"><h2>What can I help you build?</h2><div>Pick a provider, paste your API key, and start chatting.</div><div class="chips">'+['Explain transformers simply','Write a Python quicksort','Give me 5 startup ideas','Summarize the CAP theorem'].map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></div>';return}
  box.innerHTML=ch.msgs.map((m,i)=>{
    const last=i===ch.msgs.length-1;
    return '<div class="m '+m.role+'"><div class="av">'+(m.role==='user'?'U':'AI')+'</div><div class="mc"><div class="body">'+md(m.content)+'</div><div class="meta">'+(m.meta?'<span>'+esc(m.meta)+'</span>':'')+
    '<button data-a="copy" data-i="'+i+'">copy</button>'+(m.role==='user'?'<button data-a="edit" data-i="'+i+'">edit</button>':'')+(m.role==='assistant'&&last?'<button data-a="regen" data-i="'+i+'">regenerate</button>':'')+'<button data-a="del" data-i="'+i+'">delete</button></div></div></div>';
  }).join('');
  box.scrollTop=1e9;
}
$('#msgs').onclick=e=>{
  const c=e.target.closest('.chip');if(c){$('#in').value=c.textContent;send();return}
  const b=e.target.closest('[data-a]');if(!b)return;const ch=chat(),i=+b.dataset.i,m=ch.msgs[i];
  if(b.dataset.a==='copy'){try{navigator.clipboard.writeText(m.content)}catch(x){}}
  if(b.dataset.a==='del'){ch.msgs.splice(i,1);save();renderChat()}
  if(b.dataset.a==='edit'){$('#in').value=m.content;ch.msgs.splice(i);save();renderChat();$('#in').focus()}
  if(b.dataset.a==='regen'&&!busy){ch.msgs.pop();gen(ch)}
};

/* API */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function payload(msgs,model,stream){
  const m=S.sys.trim()?[{role:'system',content:S.sys}].concat(msgs):msgs;
  const p={model,messages:m,temperature:S.temp,max_tokens:S.max,top_p:S.top,stream};
  if(S.json)p.response_format={type:'json_object'};return p;
}
async function run(msgs,model,onText,signal,retry=true){
  const key=S.keys[S.prov]||'',t0=performance.now(),headers={'Content-Type':'application/json'};
  if(key)headers.Authorization='Bearer '+key;
  const r=await fetch(S.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',signal,headers,body:JSON.stringify(payload(msgs,model,S.stream))});
  if(r.status===429&&retry){const w=Math.min(+r.headers.get('retry-after')||3,15);toast('Rate limited. Retrying in '+w+'s…');await sleep(w*1000);return run(msgs,model,onText,signal,false)}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||('HTTP '+r.status))}
  let out='',n=0,tf=0,u=null;
  if(S.stream){
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d);if(j.x_groq&&j.x_groq.usage)u=j.x_groq.usage;if(j.usage)u=j.usage;
          const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){if(!tf)tf=performance.now();out+=c;n++;onText(out)}}catch(x){}}}
  }else{const j=await r.json();tf=performance.now();out=j.choices[0].message.content||'';u=j.usage;onText(out)}
  const t1=performance.now(),tok=(u&&u.completion_tokens)||n,g=(t1-(tf||t0))/1000;
  return {text:out,tok,ttft:Math.round((tf||t1)-t0),total:(t1-t0)/1000,tps:g>0?Math.round(tok/g):0,model};
}
const fmt=r=>r.model+' · '+r.tok+' tok · '+r.tps+' tok/s · '+r.total.toFixed(2)+'s';
function stats(r){$('#s1').textContent=r.tps||'–';$('#s2').textContent=r.ttft;$('#s3').textContent=r.tok;$('#s4').textContent=r.total.toFixed(2)}
function ready(){if(!S.keys[S.prov]&&S.prov!=='ollama'){toast('Add your API key in the right panel first.');return false}return true}
function setBusy(b){busy=b;$('#send').textContent=b?'Stop':'Send'}
async function send(){
  if(busy)return;const t=$('#in').value.trim();if(!t||!ready())return;
  $('#in').value='';$('#in').style.height='auto';
  if(mode==='cmp')return compare(t);
  if(!chat())newChat();const ch=chat();
  ch.msgs.push({role:'user',content:t});if(ch.title==='New chat'){ch.title=t.slice(0,40);renderList()}
  gen(ch);
}
async function gen(ch){
  ch.msgs.push({role:'assistant',content:''});renderChat();
  const m=ch.msgs[ch.msgs.length-1],body=$('#msgs').lastElementChild.querySelector('.body');
  const ctrl=new AbortController();ctrls=[ctrl];setBusy(true);
  try{
    const r=await run(ch.msgs.slice(0,-1).map(x=>({role:x.role,content:x.content})),S.model,t=>{m.content=t;body.innerHTML=md(t);$('#msgs').scrollTop=1e9},ctrl.signal);
    m.meta=fmt(r);stats(r);
  }catch(e){if(e.name==='AbortError')m.meta='stopped';else{toast(e.message);if(!m.content)ch.msgs.pop()}}
  setBusy(false);save();renderChat();
}
async function compare(t){
  const ms=[$('#mA').value,$('#mB').value],ids=['A','B'];setBusy(true);
  ctrls=ms.map(()=>new AbortController());
  await Promise.all(ms.map(async(mo,i)=>{
    const b=$('#b'+ids[i]),tt=$('#t'+ids[i]);b.innerHTML='';tt.textContent='running…';
    try{const r=await run([{role:'user',content:t}],mo,x=>{b.innerHTML=md(x)},ctrls[i].signal);tt.textContent=fmt(r)}
    catch(e){tt.textContent=e.name==='AbortError'?'stopped':e.message}
  }));
  setBusy(false);
}
$('#send').onclick=()=>busy?ctrls.forEach(c=>c.abort()):send();
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#in').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,200)+'px'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')ctrls.forEach(c=>c.abort());if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();newChat()}});

/* settings UI */
const models=()=>S.loaded[S.prov]||P[S.prov].m;
function fillModels(){
  const o=models().map(m=>'<option>'+esc(m)+'</option>').join('');
  $('#model').innerHTML=o;$('#mA').innerHTML=o;$('#mB').innerHTML=o;
  if(!models().includes(S.model))S.model=models()[0];
  $('#model').value=S.model;$('#mA').value=S.model;$('#mB').value=models()[1]||S.model;
}
function syncUI(){
  $('#prov').innerHTML=Object.keys(P).map(k=>'<option value="'+k+'">'+P[k].n+'</option>').join('');
  $('#prov').value=S.prov;$('#key').value=S.keys[S.prov]||'';$('#base').value=S.base;$('#sys').value=S.sys;
  ['temp','max','top'].forEach(k=>{$('#'+k).value=S[k];$('#'+{temp:'tv',max:'mv',top:'pv'}[k]).textContent=S[k]});
  $('#stream').checked=S.stream;$('#json').checked=S.json;fillModels();
}
$('#prov').onchange=e=>{S.prov=e.target.value;if(P[S.prov].u)S.base=P[S.prov].u;S.model=models()[0];syncUI();save()};
$('#key').onchange=e=>{S.keys[S.prov]=e.target.value;save()};
$('#base').onchange=e=>{S.base=e.target.value;save()};
$('#model').onchange=e=>{S.model=e.target.value;save()};
$('#sys').onchange=e=>{S.sys=e.target.value;save()};
[['temp','tv'],['max','mv'],['top','pv']].forEach(([k,v])=>$('#'+k).oninput=e=>{S[k]=+e.target.value;$('#'+v).textContent=S[k];$('#preset').value='';save()});
$('#preset').onchange=e=>{if(!e.target.value)return;const [t,p]=e.target.value.split(',').map(Number);S.temp=t;S.top=p;syncUI();save();$('#preset').value=e.target.value};
$('#stream').onchange=e=>{S.stream=e.target.checked;save()};
$('#json').onchange=e=>{S.json=e.target.checked;save()};
$('#load').onclick=async()=>{
  try{const h={};if(S.keys[S.prov])h.Authorization='Bearer '+S.keys[S.prov];
    const j=await(await fetch(S.base.replace(/\/$/,'')+'/models',{headers:h})).json();
    const arr=(j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean).sort();if(!arr.length)throw new Error('No models returned');
    S.loaded[S.prov]=arr;fillModels();save();toast('Loaded '+arr.length+' models')}catch(e){toast('Could not load models: '+e.message)}
};
$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save()};
$('#newc').onclick=newChat;
$('#tl').onclick=()=>$('#left').classList.toggle('open');$('#tr').onclick=()=>$('#right').classList.toggle('open');
function setMode(m){mode=m;$('#chatv').style.display=m==='chat'?'flex':'none';$('#cmp').style.display=m==='cmp'?'flex':'none';$('#mChat').classList.toggle('on',m==='chat');$('#mCmp').classList.toggle('on',m==='cmp')}
$('#mChat').onclick=()=>setMode('chat');$('#mCmp').onclick=()=>setMode('cmp');

/* export / import */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:'application/json'}));a.download='playground-chats.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j))throw 0;C=j.concat(C);cur=C[0]&&C[0].id;save();renderList();renderChat();toast('Imported '+j.length+' chats')}catch(x){toast('Invalid file')}e.target.value=''};

/* code view */
function genCode(){
  const ch=chat(),p=payload(ch?ch.msgs.map(x=>({role:x.role,content:x.content})):[{role:'user',content:'Hello'}],S.model,S.stream),url=S.base.replace(/\/$/,'')+'/chat/completions',j=JSON.stringify(p,null,2);
  if(lang==='curl')return 'curl '+url+' \\\n  -H "Content-Type: application/json" \\\n  -H "Authorization: Bearer $API_KEY" \\\n  -d \''+j.replace(/'/g,"'\\''")+"'";
  if(lang==='python')return 'import os\nfrom openai import OpenAI\n\nclient = OpenAI(base_url="'+S.base+'", api_key=os.environ["API_KEY"])\nresp = client.chat.completions.create(**'+j.replace(/\btrue\b/g,'True').replace(/\bfalse\b/g,'False')+')\nprint(resp.choices[0].message.content)';
  return 'const res = await fetch("'+url+'", {\n  method: "POST",\n  headers: { "Content-Type": "application/json", "Authorization": "Bearer " + process.env.API_KEY },\n  body: JSON.stringify('+j.replace(/\n/g,'\n  ')+')\n});\nconsole.log(await res.json());';
}
$('#codeBtn').onclick=()=>{$('#code').textContent=genCode();$('#dlg').showModal()};
$('#close').onclick=()=>$('#dlg').close();
$('#copy').onclick=()=>{try{navigator.clipboard.writeText($('#code').textContent)}catch(e){}$('#copy').textContent='Copied';setTimeout(()=>$('#copy').textContent='Copy',1200)};
document.querySelectorAll('.tabs .btn').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.toggle('on',x===b));$('#code').textContent=genCode()});

syncUI();cur=C[0]?C[0].id:null;if(!cur)newChat();else{renderList();renderChat()}
</script>
</body>
</html>
